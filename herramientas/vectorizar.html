<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Vectorizar logo</title></head>
<body>
<!--
  Vectoriza un logo claro sobre fondo oscuro (o al revés) a un SVG de curvas.
  Uso: vectorizar.ps1 inyecta la imagen como data URI en IMAGEN_FUENTE y lee
  el SVG resultante del bloque "salida" con Edge en modo headless.
-->
<pre id="salida"></pre>
<script>
const IMAGEN_FUENTE = "__IMAGEN__";
const OPCIONES = { escala: 4, umbral: 128, invertir: false, areaMinima: 40, tolerancia: 1.8, sigma: 4, anguloEsquina: 55, ventanaEsquina: 10, rectaDesvio: 2.2, rectaPanza: 0.5, rectaMinima: 48 };

function cargar(src) {
  return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
}

function recorte(img) {
  const cv = document.createElement("canvas");
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.drawImage(img, 0, 0);
  const d = cx.getImageData(0, 0, cv.width, cv.height).data;
  let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
    const p = (y * cv.width + x) * 4;
    const lum = 0.2126 * d[p] + 0.7152 * d[p + 1] + 0.0722 * d[p + 2];
    if ((lum > OPCIONES.umbral) !== OPCIONES.invertir) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  }
  const m = 6;
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
  x1 = Math.min(cv.width - 1, x1 + m); y1 = Math.min(cv.height - 1, y1 + m);
  return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function binarizar(img) {
  const S = OPCIONES.escala;
  const r = recorte(img);
  const w = r.w * S, h = r.h * S;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = "high";
  cx.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;
  const b = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < b.length; i++, p += 4) {
    const lum = 0.2126 * d[p] + 0.7152 * d[p + 1] + 0.0722 * d[p + 2];
    const dentro = d[p + 3] > 127 && lum > OPCIONES.umbral;
    b[i] = OPCIONES.invertir ? (dentro ? 0 : 1) : (dentro ? 1 : 0);
  }
  return { b, w, h };
}

// Bordes entre píxeles dentro/fuera, orientados en sentido horario alrededor del relleno.
function contornos({ b, w, h }) {
  const en = (x, y) => x >= 0 && y >= 0 && x < w && y < h && b[y * w + x] === 1;
  const salida = new Map();
  const clave = (x, y) => y * (w + 1) + x;
  const agregar = (x1, y1, x2, y2) => {
    const k = clave(x1, y1);
    if (!salida.has(k)) salida.set(k, []);
    salida.get(k).push([x2, y2]);
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!en(x, y)) continue;
    if (!en(x, y - 1)) agregar(x, y, x + 1, y);
    if (!en(x + 1, y)) agregar(x + 1, y, x + 1, y + 1);
    if (!en(x, y + 1)) agregar(x + 1, y + 1, x, y + 1);
    if (!en(x - 1, y)) agregar(x, y + 1, x, y);
  }
  const lazos = [];
  for (const [k0, lista0] of salida) {
    while (lista0.length) {
      const x0 = k0 % (w + 1), y0 = (k0 - x0) / (w + 1);
      const pts = [[x0, y0]];
      let [px, py] = [x0, y0];
      let [nx, ny] = lista0.pop();
      let dx = nx - px, dy = ny - py;
      while (!(nx === x0 && ny === y0)) {
        pts.push([nx, ny]);
        const lista = salida.get(clave(nx, ny));
        let idx = 0;
        if (lista.length > 1) {
          // En un cruce diagonal gira a la derecha: separa figuras que solo se tocan en una esquina.
          idx = lista.findIndex(([ax, ay]) => (ax - nx) === -dy && (ay - ny) === dx);
          if (idx < 0) idx = 0;
        }
        const [sx, sy] = lista.splice(idx, 1)[0];
        dx = sx - nx; dy = sy - ny;
        px = nx; py = ny; nx = sx; ny = sy;
      }
      lazos.push(pts);
    }
  }
  return lazos;
}

function area(p) {
  let a = 0;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]);
  return a / 2;
}

function esquinas(p) {
  const n = p.length, k = OPCIONES.ventanaEsquina, lim = Math.cos((OPCIONES.anguloEsquina * Math.PI) / 180);
  const cosAng = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const a = p[(i - k + n) % n], c = p[i], d = p[(i + k) % n];
    const v1x = c[0] - a[0], v1y = c[1] - a[1], v2x = d[0] - c[0], v2y = d[1] - c[1];
    cosAng[i] = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1);
  }
  const res = [];
  for (let i = 0; i < n; i++) {
    if (cosAng[i] > lim) continue;
    let esMin = true;
    for (let j = -k; j <= k && esMin; j++) if (j && cosAng[(i + j + n) % n] < cosAng[i]) esMin = false;
    if (esMin && (!res.length || i - res[res.length - 1] > k)) res.push(i);
  }
  if (res.length > 1 && res[0] + n - res[res.length - 1] <= k) res.pop();
  return res;
}

function suavizar(seg, sigma) {
  const n = seg.length;
  if (n < 5) return seg.map((q) => [q[0], q[1]]);
  const r = Math.ceil(sigma * 3), pesos = [];
  for (let j = -r; j <= r; j++) pesos.push(Math.exp(-(j * j) / (2 * sigma * sigma)));
  const out = [seg[0].slice()];
  for (let i = 1; i < n - 1; i++) {
    const alcance = Math.min(r, i, n - 1 - i);
    let sx = 0, sy = 0, sw = 0;
    for (let j = -alcance; j <= alcance; j++) { const wgt = pesos[j + r]; sx += seg[i + j][0] * wgt; sy += seg[i + j][1] * wgt; sw += wgt; }
    out.push([sx / sw, sy / sw]);
  }
  out.push(seg[n - 1].slice());
  return out;
}

/* ---- Ajuste de curvas Bézier cúbicas (algoritmo de Schneider) ---- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const suma = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s];
const punto = (a, b) => a[0] * b[0] + a[1] * b[1];
const norm = (a) => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

function bez(c, t) {
  const u = 1 - t;
  return suma(suma(mul(c[0], u * u * u), mul(c[1], 3 * u * u * t)), suma(mul(c[2], 3 * u * t * t), mul(c[3], t * t * t)));
}
function bezD1(c, t) {
  const u = 1 - t;
  return suma(suma(mul(sub(c[1], c[0]), 3 * u * u), mul(sub(c[2], c[1]), 6 * u * t)), mul(sub(c[3], c[2]), 3 * t * t));
}
function bezD2(c, t) {
  return suma(mul(suma(sub(c[2], mul(c[1], 2)), c[0]), 6 * (1 - t)), mul(suma(sub(c[3], mul(c[2], 2)), c[1]), 6 * t));
}

function generar(pts, u, t1, t2) {
  const p0 = pts[0], p3 = pts[pts.length - 1];
  let c00 = 0, c01 = 0, c11 = 0, x0 = 0, x1 = 0;
  for (let i = 0; i < pts.length; i++) {
    const t = u[i], s = 1 - t;
    const a1 = mul(t1, 3 * s * s * t), a2 = mul(t2, 3 * s * t * t);
    c00 += punto(a1, a1); c01 += punto(a1, a2); c11 += punto(a2, a2);
    const tmp = sub(pts[i], bez([p0, p0, p3, p3], t));
    x0 += punto(a1, tmp); x1 += punto(a2, tmp);
  }
  const det = c00 * c11 - c01 * c01;
  let al = det ? (x0 * c11 - x1 * c01) / det : 0;
  let ar = det ? (c00 * x1 - c01 * x0) / det : 0;
  const largo = dist(p0, p3), eps = 1e-6 * largo;
  if (al < eps || ar < eps) { al = ar = largo / 3; }
  return [p0, suma(p0, mul(t1, al)), suma(p3, mul(t2, ar)), p3];
}

function parametrizar(pts) {
  const u = [0];
  for (let i = 1; i < pts.length; i++) u.push(u[i - 1] + dist(pts[i], pts[i - 1]));
  const total = u[u.length - 1] || 1;
  return u.map((v) => v / total);
}

function errorMax(pts, c, u) {
  let max = 0, idx = Math.floor(pts.length / 2);
  for (let i = 1; i < pts.length - 1; i++) {
    const d = dist(bez(c, u[i]), pts[i]) ** 2;
    if (d >= max) { max = d; idx = i; }
  }
  return [max, idx];
}

function reparametrizar(pts, u, c) {
  return u.map((t, i) => {
    const d = sub(bez(c, t), pts[i]), d1 = bezD1(c, t), d2 = bezD2(c, t);
    const den = punto(d1, d1) + punto(d, d2);
    const nt = den ? t - punto(d, d1) / den : t;
    return Math.min(1, Math.max(0, nt));
  });
}

function ajustar(pts, t1, t2, tol, curvas) {
  if (pts.length === 2) {
    const l = dist(pts[0], pts[1]) / 3;
    curvas.push([pts[0], suma(pts[0], mul(t1, l)), suma(pts[1], mul(t2, l)), pts[1]]);
    return;
  }
  let u = parametrizar(pts);
  let c = generar(pts, u, t1, t2);
  let [err, div] = errorMax(pts, c, u);
  const tol2 = tol * tol;
  if (err < tol2) { curvas.push(c); return; }
  if (err < tol2 * 16) {
    for (let k = 0; k < 20; k++) {
      u = reparametrizar(pts, u, c);
      c = generar(pts, u, t1, t2);
      [err, div] = errorMax(pts, c, u);
      if (err < tol2) { curvas.push(c); return; }
    }
  }
  const tc = norm(sub(pts[div - 1], pts[div + 1]));
  ajustar(pts.slice(0, div + 1), t1, tc, tol, curvas);
  ajustar(pts.slice(div), mul(tc, -1), t2, tol, curvas);
}

function tangenteInicio(p) { return norm(sub(p[Math.min(3, p.length - 1)], p[0])); }
function tangenteFin(p) { return norm(sub(p[Math.max(0, p.length - 4)], p[p.length - 1])); }

function rdp(p, i, j, eps, res) {
  const A = p[i], B = p[j];
  const dir = norm(sub(B, A));
  let max = 0, idx = -1;
  for (let k = i + 1; k < j; k++) {
    const v = sub(p[k], A), d = Math.abs(v[0] * dir[1] - v[1] * dir[0]);
    if (d > max) { max = d; idx = k; }
  }
  if (max > eps && idx > 0) { rdp(p, i, idx, eps, res); res.push(idx); rdp(p, idx, j, eps, res); }
}

// Un tramo es recto si nada se aleja de la cuerda y no hay una panza sistemática (curvatura real).
function esRecta(p, i, j) {
  const A = p[i], B = p[j], L = dist(A, B);
  if (L < 1) return false;
  const dir = [(B[0] - A[0]) / L, (B[1] - A[1]) / L];
  let num = 0, den = 0;
  for (let k = i; k <= j; k++) {
    const v = sub(p[k], A);
    const u = Math.min(1, Math.max(0, punto(v, dir) / L));
    const d = v[0] * dir[1] - v[1] * dir[0];
    if (Math.abs(d) > OPCIONES.rectaDesvio) return false;
    const g = 4 * u * (1 - u);
    num += d * g; den += g * g;
  }
  return !den || Math.abs(num / den) <= OPCIONES.rectaPanza;
}

function piezas(pts) {
  const V = [0];
  rdp(pts, 0, pts.length - 1, OPCIONES.rectaDesvio * 0.8, V);
  V.push(pts.length - 1);
  const lineas = [];
  for (let a = 0; a < V.length - 1;) {
    let mejor = -1;
    for (let b = a + 1; b < V.length && esRecta(pts, V[a], V[b]); b++) mejor = b;
    if (mejor > 0 && dist(pts[V[a]], pts[V[mejor]]) >= OPCIONES.rectaMinima) { lineas.push([V[a], V[mejor]]); a = mejor; }
    else a++;
  }
  // Rectas encadenadas casi en la misma dirección delatan una curva suave partida en facetas: se descartan.
  const direccion = ([a, b]) => Math.atan2(pts[b][1] - pts[a][1], pts[b][0] - pts[a][0]);
  const casiIgual = (l1, l2) => {
    let d = Math.abs(direccion(l1) - direccion(l2));
    if (d > Math.PI) d = 2 * Math.PI - d;
    return d < (20 * Math.PI) / 180;
  };
  const descartar = new Set();
  for (let k = 1; k < lineas.length; k++) {
    if (lineas[k - 1][1] === lineas[k][0] && casiIgual(lineas[k - 1], lineas[k])) { descartar.add(k - 1); descartar.add(k); }
  }
  const res = [];
  let cursor = 0;
  for (const [a, b] of lineas.filter((_, k) => !descartar.has(k))) {
    if (a > cursor) res.push({ tipo: "curva", i: cursor, j: a });
    res.push({ tipo: "linea", i: a, j: b });
    cursor = b;
  }
  if (cursor < pts.length - 1) res.push({ tipo: "curva", i: cursor, j: pts.length - 1 });
  return res;
}

function lazoASVG(p, f, ox, oy) {
  const n = p.length;
  let cortes = esquinas(p);
  const cerrado = !cortes.length;
  if (cerrado) cortes = [0];
  const fmt = (q) => `${((q[0] - ox) / f).toFixed(2)} ${((q[1] - oy) / f).toFixed(2)}`;
  let d = "";
  for (let s = 0; s < cortes.length; s++) {
    const a = cortes[s], b = cortes[(s + 1) % cortes.length];
    let suave, t1, t2;
    if (cerrado) {
      // Sin esquinas: suaviza de forma circular para no marcar un pico en el punto de inicio.
      const r = Math.ceil(OPCIONES.sigma * 3);
      const ext = suavizar([...p.slice(n - r), ...p, ...p.slice(0, r + 1)], OPCIONES.sigma);
      suave = ext.slice(r, r + n + 1);
      suave[n] = suave[0];
      t1 = norm(sub(suave[1], suave[n - 1]));
      t2 = mul(t1, -1);
    } else {
      const seg = [];
      const largo = (b - a + n) % n || n;
      for (let i = 0; i <= largo; i++) seg.push(p[(a + i) % n]);
      suave = suavizar(seg, OPCIONES.sigma);
      t1 = tangenteInicio(suave);
      t2 = tangenteFin(suave);
    }
    if (!d) d = `M${fmt(suave[0])}`;
    const lista = piezas(suave);
    lista.forEach((pz, idx) => {
      if (pz.tipo === "linea") { d += `L${fmt(suave[pz.j])}`; return; }
      const tramo = suave.slice(pz.i, pz.j + 1);
      if (tramo.length < 2) return;
      const antes = lista[idx - 1], despues = lista[idx + 1];
      const ini = antes ? norm(sub(suave[antes.j], suave[antes.i])) : (pz.i === 0 ? t1 : tangenteInicio(tramo));
      const fin = despues ? norm(sub(suave[despues.i], suave[despues.j])) : (pz.j === suave.length - 1 ? t2 : tangenteFin(tramo));
      const curvas = [];
      ajustar(tramo, ini, fin, OPCIONES.tolerancia, curvas);
      for (const c of curvas) d += `C${fmt(c[1])} ${fmt(c[2])} ${fmt(c[3])}`;
    });
  }
  return d + "Z";
}

(async () => {
  const salida = document.getElementById("salida");
  try {
    const img = await cargar(IMAGEN_FUENTE);
    const bin = binarizar(img);
    const lazos = contornos(bin).filter((l) => Math.abs(area(l)) >= OPCIONES.areaMinima * OPCIONES.escala * OPCIONES.escala);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const l of lazos) for (const [x, y] of l) { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }
    const f = OPCIONES.escala;
    const vw = ((maxX - minX) / f).toFixed(2), vh = ((maxY - minY) / f).toFixed(2);
    const d = lazos.map((l) => lazoASVG(l, f, minX, minY)).join("");
    salida.textContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vw} ${vh}"><path fill="currentColor" fill-rule="evenodd" d="${d}"/></svg>`;
  } catch (e) {
    salida.textContent = "ERROR: " + (e && e.stack || e);
  }
})();
</script>
</body>
</html>
